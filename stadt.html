<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0a0b">
<title>Stuttgart · Gönül Plak</title>
<style>
:root{--g1:#ffe2a3;--g2:#f4b13e;--ink:#f6efe2;--glass:rgba(14,12,16,.55);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0c0a0b;color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#stage,#stage canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.cap{position:fixed;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#hud{top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px))}
#hud .rb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06)}
#hud .rb svg{width:20px;height:20px}
#hud .tt{padding:0 12px 0 4px;line-height:1.1}#hud .tt b{display:block;font-family:Georgia,serif;font-weight:400;font-size:1.02rem;color:var(--g1)}#hud .tt small{color:rgba(246,239,226,.6);font-size:.72rem}
#comp{top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px));width:52px;height:52px;padding:0;justify-content:center}
#needle{width:40px;height:40px;transition:transform .08s linear}
#run{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-size:.72rem;font-weight:700;letter-spacing:.06em}
#run svg{width:26px;height:26px}#run.on{background:linear-gradient(180deg,var(--g1),var(--g2));color:#2a1a10;border-color:transparent;box-shadow:0 0 18px rgba(244,177,62,.5)}
#stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(10,10,14,.25);opacity:0;pointer-events:none;transition:opacity .15s}
#stick.on{opacity:1}#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 2px 10px #0006}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);text-align:center;font-size:.8rem;color:rgba(255,255,255,.75);text-shadow:0 1px 4px #000;pointer-events:none;transition:opacity 1s}
#attr{position:fixed;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 4px);font-size:.62rem;color:rgba(255,255,255,.85);text-shadow:0 1px 3px #000;pointer-events:none;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-10px);opacity:0;transition:.3s;padding:10px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-size:.88rem;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#load{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;
  background:radial-gradient(120% 80% at 50% 30%,#2a1c14,#0c0a0b 70%);transition:opacity .9s}
#load.out{opacity:0;pointer-events:none}
#load h1{margin:0;font-family:Georgia,serif;font-weight:400;font-size:2.2rem;color:var(--g1);text-shadow:0 0 18px rgba(244,177,62,.35)}
#load p{margin:0;color:rgba(246,239,226,.7);max-width:420px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,226,163,.2);border-top-color:var(--g1);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#load.out .spin{display:none}
#keybox{width:min(420px,100%);display:flex;flex-direction:column;gap:10px;text-align:left;padding:16px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
#keybox b{color:var(--g1)}#keybox ol{margin:0;padding-left:20px;font-size:.84rem;color:rgba(246,239,226,.8)}#keybox li{margin:3px 0}
#keybox input{font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#00000055;color:var(--ink)}
.btn{padding:12px 16px;border-radius:12px;background:linear-gradient(180deg,var(--g1),var(--g2));color:#2a1a10;font-weight:700}
#keybox small{color:rgba(246,239,226,.55);font-size:.74rem}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud" class="cap"><button class="rb" id="back" aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><div class="tt"><b>Stuttgart</b><small>Schlossplatz</small></div></div>
<div id="comp" class="cap" aria-hidden="true"><svg id="needle" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="rgba(255,255,255,.18)"/><path d="M20 5l4 15h-8z" fill="#ff5a4a"/><path d="M20 35l-4-15h8z" fill="#e8e2d6"/><text x="20" y="14" text-anchor="middle" font-size="0" fill="#fff">N</text></svg></div>
<button id="run" aria-label="Koş"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4.5" r="2"/><path d="M8 21l3-6 3 2 1 5M6 12l3-3 4 1 3 3 3 1M11 15l1-5"/></svg></button>
<div id="stick"><div id="knob"></div></div>
<div id="hint">Sol tarafta parmağını kaydır: yürü · Sağ tarafta kaydır: etrafa bak</div>
<div id="attr"></div>
<div id="toast"></div>
<div id="load">
  <h1>Stuttgart</h1>
  <div class="spin"></div>
  <p id="loadtxt">Hazırlanıyor…</p>
</div>
<script>setTimeout(function(){var h=document.getElementById('hint');if(h)h.style.opacity=0},9000)</script>
<script type="module" src="stadt/stadt.js"></script>
</body>
</html>
