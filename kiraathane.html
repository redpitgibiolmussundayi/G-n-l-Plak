<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Kıraathane</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
<!-- Gönül Plak · Stuttgart Kıraathanesi: 3D kıraathane simülasyonu (three.js, MIT). Okey, bilardo, nargile, TV, plak çalar; arkadaşlarınla online. -->
<script type="importmap">{ "imports": { "three": "./kh-three.js" } }</script>
<style>
:root{--g1:#ffe2a3;--g2:#f0b85a;--g3:#b9792c;--ink:#1d1108;--glass:rgba(16,11,8,.58);--line:rgba(255,232,196,.16);--txt:#fbf1e2;--mut:rgba(251,241,226,.66)}
html,body{margin:0;height:100%;background:#0b0705;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Inter,Roboto,sans-serif;color:var(--txt)}
#css,#gl,#tl{position:fixed;inset:0}
#css{z-index:0;pointer-events:none}#css.watch{pointer-events:auto}
#gl{z-index:1;pointer-events:none}#gl canvas{display:block}
#tl{z-index:2;touch-action:none}#tl.off{pointer-events:none}
button{font:inherit;color:inherit;border:0;padding:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.4}
.ui{position:fixed;z-index:5}
.gl{background:var(--glass);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
.ln{fill:none;stroke:var(--txt);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* sinematik kenar karartma */
#vig{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.42) 100%)}
/* sol üst: konum kartı */
#hudL{left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 4px;border-radius:22px}
#back{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.08)}
#back svg{width:18px;height:18px}
#ttl{display:flex;flex-direction:column;min-width:0;max-width:34vw}
#ttl b{font:700 13px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--g1)}
#ttl small{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
/* sağ üst: araç çubuğu */
#rt{right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;gap:2px;height:44px;padding:0 4px;border-radius:22px;align-items:center}
#rt button{width:38px;height:38px;border-radius:19px;display:grid;place-items:center;position:relative;transition:background .2s}
#rt button svg{width:19px;height:19px}
#rt button.on{background:rgba(240,184,90,.22)}#rt button.on .ln{stroke:var(--g1)}
#rt button.on::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:2px;background:var(--g2)}
#say{left:calc(10px + env(safe-area-inset-left));top:calc(62px + env(safe-area-inset-top));width:44px;height:44px;border-radius:22px;display:grid;place-items:center}
#say svg{width:20px;height:20px}
/* sağ alt: ana eylem düğmesi + yan düğmeler */
#act{right:calc(18px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:72px;height:72px;border-radius:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:radial-gradient(circle at 50% 30%,#ffe7b2,#f0b85a 55%,#b9792c);color:var(--ink);box-shadow:0 0 0 3px rgba(255,226,163,.25),0 10px 26px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.5);transition:transform .15s}
#act i{font-style:normal;font-size:24px;line-height:1}
#act span{font-size:10.5px;font-weight:750;letter-spacing:.2px;max-width:66px;text-align:center;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#act.pulse{animation:apulse 1.6s infinite}
@keyframes apulse{50%{box-shadow:0 0 0 7px rgba(255,226,163,.12),0 10px 26px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.5)}}
.rb{width:50px;height:50px;border-radius:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .15s}
.rb i{font-style:normal;font-size:18px;line-height:1}.rb span{font-size:9px;font-weight:650;color:var(--mut)}
#act2{right:calc(100px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom))}
#sip{right:calc(30px + env(safe-area-inset-right));bottom:calc(100px + env(safe-area-inset-bottom))}
#act:active,.rb:active{transform:scale(.92)}
#okinfo[hidden],#act[hidden],#act2[hidden],#sip[hidden],#say[hidden],#joy[hidden],.hint[hidden],#okbar[hidden],#ngbar[hidden],#wp[hidden]{display:none!important}
/* dünyadaki ipucu (nesnenin üstünde) */
#wp{position:fixed;z-index:4;left:0;top:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:16px;font-size:12px;font-weight:650;pointer-events:none;white-space:nowrap;transition:opacity .2s}
#wp i{font-style:normal;width:20px;height:20px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(#ffe7b2,#e1a24a);color:var(--ink);font-size:11px}
#wp::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;margin-left:-5px;background:inherit;border:inherit;border-top:0;border-left:0;transform:rotate(45deg);border-radius:0 0 3px 0}
/* joystick */
#joy{position:fixed;z-index:4;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:radial-gradient(circle,rgba(255,240,220,.04) 40%,rgba(255,240,220,.1));border:1.5px solid rgba(255,230,200,.3);box-shadow:0 0 30px rgba(0,0,0,.25);pointer-events:none}
#joy::before{content:"";position:absolute;inset:10px;border-radius:50%;border:1px dashed rgba(255,230,200,.18)}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:radial-gradient(circle at 40% 32%,#fff3da,#e9b45f 60%,#a8692a);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.hint{left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 14px;border-radius:16px;font-size:12.5px;text-align:center;line-height:1.4;max-width:min(76vw,380px);pointer-events:none}
#cross{position:fixed;z-index:3;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,240,220,.55);box-shadow:0 0 0 1.5px rgba(0,0,0,.25);pointer-events:none;transition:transform .15s,background .15s}
#cross.hot{transform:scale(2.2);background:var(--g1)}
body.okey #cross,body.tp #cross{display:none}
#toast{left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-10px) scale(.96);padding:8px 15px;border-radius:18px;font-size:12.5px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;max-width:84vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
/* paneller */
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:12px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .2s}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(16px);opacity:0}}
.modal[hidden]{display:none}
.card{position:relative;width:min(94vw,460px);max-height:86vh;overflow:auto;border-radius:22px;padding:18px 16px 16px;background:linear-gradient(180deg,rgba(40,28,20,.92),rgba(18,12,9,.95));border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);-webkit-overflow-scrolling:touch;animation:up .25s}
.card h2{margin:0 0 12px;font:700 17px/1.2 Georgia,serif;color:var(--g1);padding-right:40px}
.card .x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:16px;background:rgba(255,255,255,.08);font-size:13px}
@media (orientation:portrait){.modal{align-items:flex-end;padding:0}.card{width:100%;border-radius:24px 24px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom));max-height:78vh}}
.lbl{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:14px 0 7px;font-weight:650}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.segs button{padding:7px 11px;border-radius:14px;background:rgba(255,255,255,.07);font-size:12.5px;border:1px solid transparent}
.segs button.on{background:linear-gradient(#ffe2a3,#e5a64e);color:var(--ink);font-weight:700}
.btn{display:block;width:100%;margin-top:10px;height:44px;border-radius:14px;background:linear-gradient(#ffe2a3,#e5a64e 60%,#c4853a);color:var(--ink);font-weight:750;font-size:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.btn.sec{background:rgba(255,255,255,.08);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.btn.sm{height:38px;font-size:13px;margin-top:0;width:auto;padding:0 14px}
.inp{width:100%;box-sizing:border-box;height:42px;border-radius:13px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--txt);font-size:16px;padding:0 12px;outline:none}
.inp:focus{border-color:rgba(240,184,90,.6)}
.ovs{font-size:12.5px;color:var(--mut);line-height:1.45;margin-top:9px}.ovs a{color:var(--g1)}
.big{font:700 34px Georgia,serif;letter-spacing:8px;text-align:center;margin:6px 0;color:var(--g1)}
.list button{display:block;width:100%;text-align:left;padding:10px 12px;margin-top:6px;border-radius:12px;background:rgba(255,255,255,.06);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phr,.chips{display:flex;flex-wrap:wrap;gap:6px}.phr button,.chips button{padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.08);font-size:13px;border:1px solid var(--line)}
.chips{margin:10px 0 4px}
.srch{display:flex;gap:6px}.srch .inp{flex:1}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px;margin-top:10px}
.vgrid button{display:flex;flex-direction:column;text-align:left;gap:3px;border-radius:13px;overflow:hidden;background:rgba(255,255,255,.05);padding:0 0 7px;border:1px solid var(--line)}
.vgrid img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
.vgrid b{font-size:11.5px;font-weight:650;line-height:1.25;padding:0 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vgrid small{font-size:10.5px;color:var(--mut);padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row2{display:flex;gap:6px;margin-top:10px}.row2 .btn{flex:1}
.lnk{margin-top:10px;font-size:12.5px;color:var(--mut)}.lnk summary{cursor:pointer;padding:4px 0}.lnk .inp{margin:6px 0}
.nowp{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.nowp .disc{width:48px;height:48px;border-radius:24px;flex:none;background:radial-gradient(circle,#b8282f 0 22%,#111 23% 26%,#1b1b1d 27%,#0d0d0e 60%,#222 61%,#0d0d0e 63%);animation:spin 3s linear infinite;animation-play-state:paused}
.nowp.on .disc{animation-play-state:running}@keyframes spin{to{transform:rotate(360deg)}}
.nowp div{display:flex;flex-direction:column;gap:2px;min-width:0}.nowp b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nowp small,.nowp span{font-size:12px;color:var(--mut)}
.sws{display:flex;flex-wrap:wrap;gap:7px}.sws button{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}.sws button.on{box-shadow:0 0 0 2px var(--g2),inset 0 0 0 1px rgba(0,0,0,.3)}
.sws button[data-c="0"]{background:repeating-linear-gradient(45deg,#333 0 4px,#555 4px 8px)!important}
#okf{position:fixed;inset:0;z-index:30;background:#0b0705}
#okf[hidden]{display:none}#okf iframe{width:100%;height:100%;border:0;display:block}
#tvbar{left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:22px}
#tvbar[hidden]{display:none}#tvbar button{height:36px;border-radius:18px;padding:0 13px;font-size:13px;font-weight:650}
#tvbar button:hover{background:rgba(255,255,255,.08)}
/* okey */
#okbar{left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
#okinfo{position:fixed;left:50%;bottom:calc(58px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:6px 13px;border-radius:15px;font-size:12px;font-weight:600;text-align:center;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.okb{display:flex;gap:3px;padding:4px;border-radius:22px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.okb button{height:36px;min-width:58px;padding:0 13px;border-radius:18px;font-size:13px;font-weight:700;background:none!important;border:0!important;box-shadow:none!important}
.okb button.fin.on{background:linear-gradient(#7bf0a2,#2fa864)!important;color:#062a14;animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(95,224,138,.35)!important}}
body.okey #act,body.okey #act2,body.okey #wp{display:none!important}
/* nargile */
#ngbar{left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(94vw,520px)}
#ngbar .ngt{padding:6px 13px;border-radius:15px;background:var(--glass);border:1px solid var(--line);font-size:12.5px;font-weight:600;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#ngbar button.gl{height:40px;padding:0 16px;border-radius:20px;font-size:13.5px;font-weight:650}
#ngbar .hold{width:84px;height:84px!important;border-radius:42px!important;font-size:15px!important;touch-action:none;background:radial-gradient(circle at 50% 30%,#fff,#d8e6ee 60%,#9fb5c2)!important;color:#12222c}
#ngbar .chips{justify-content:center;margin:0}
/* yükleme ekranı */
#load{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b0705;transition:opacity .6s}
#load::before{content:"";position:absolute;inset:-20px;background:url(kh-th.webp) center/cover;filter:blur(14px) brightness(.38) saturate(1.2);transform:scale(1.05)}
#load>*{position:relative}
#load .lg{font:700 clamp(26px,6vw,44px)/1 Georgia,"Times New Roman",serif;letter-spacing:.5px;color:var(--g1);text-shadow:0 4px 30px rgba(240,184,90,.35);text-align:center}
#load .lg small{display:block;font:500 12px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:4px;text-transform:uppercase;color:var(--mut);margin-top:8px}
#load .bar{width:min(60vw,320px);height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
#load .bar i{display:block;height:100%;width:5%;background:linear-gradient(90deg,#b9792c,#ffe2a3);border-radius:2px;transition:width .4s}
#load #loadtxt{font-size:12px;color:var(--mut)}
#load.out{opacity:0;pointer-events:none}
#okinfo:empty,#say:empty,#wp:empty{display:none!important}
@media (min-width:760px) and (min-height:520px){#hudL,#rt{height:50px}#rt button{width:44px;height:44px}#act{width:84px;height:84px;border-radius:42px}#act i{font-size:28px}}
</style>
</head>
<body>
<div id="css"></div><div id="gl"></div><div id="tl"></div><div id="vig"></div><div id="cross"></div>
<div id="joy" hidden><i></i></div>
<div class="ui gl" id="hudL">
  <button id="back" aria-label="Geri"><svg viewBox="0 0 24 24"><path class="ln" d="M15 5l-7 7 7 7"/></svg></button>
  <div id="ttl"><b>Stuttgart Kıraathanesi</b><small id="sub">Hoş geldin</small></div>
</div>
<div class="ui gl" id="rt">
  <button id="bcam" aria-label="Kamera"><svg viewBox="0 0 24 24"><path class="ln" d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle class="ln" cx="12" cy="12" r="3"/></svg></button>
  <button id="bav" aria-label="Karakter"><svg viewBox="0 0 24 24"><circle class="ln" cx="12" cy="7.5" r="3.5"/><path class="ln" d="M5 20c.8-4 3.6-6 7-6s6.2 2 7 6"/></svg></button>
  <button id="bnet" aria-label="Online"><svg viewBox="0 0 24 24"><circle class="ln" cx="12" cy="12" r="9"/><path class="ln" d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg></button>
  <button id="bset" aria-label="Ayarlar"><svg viewBox="0 0 24 24"><circle class="ln" cx="12" cy="12" r="3"/><path class="ln" d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
</div>
<button class="ui gl" id="say" hidden aria-label="Sohbet"><svg viewBox="0 0 24 24"><path class="ln" d="M4 5h16v11H9l-5 4z"/></svg></button>
<div class="ui gl" id="wp" hidden><i>●</i><span></span></div>
<button class="ui" id="act" hidden></button>
<button class="ui gl rb" id="act2" hidden></button>
<button class="ui gl rb" id="sip" hidden><i>🍵</i><span>Yudumla</span></button>
<div class="ui gl" id="tvbar" hidden><button data-tv="pick">📺 Başka video</button><button data-tv="sync">⟳ Eşitle</button><button data-tv="off">Kapat</button><button data-tv="up">Geri</button></div>
<div class="ui" id="ngbar" hidden></div>
<div class="ui gl hint" id="hint" hidden></div>
<div class="ui gl" id="toast"></div>
<div class="modal" id="modal" hidden><div class="card"><button class="x" data-a="close">✕</button><div id="mc"></div></div></div>
<div id="okf" hidden></div>
<div id="load"><div class="lg">Stuttgart Kıraathanesi<small>çay · sohbet · okey · manzara</small></div><div class="bar"><i id="loadbar"></i></div><div id="loadtxt">Çay demleniyor…</div></div>
<script src="i18n.js"></script>
<script src="config.js" onerror="void 0"></script>
<script src="net.js"></script>
<script type="module" src="kh.js"></script>
</body>
</html>
