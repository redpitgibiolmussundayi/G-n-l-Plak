<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Okey</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
<style>
html,body{margin:0;height:100%;background:#120a07;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
#ok{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
#ok canvas{position:absolute;left:0;top:0;display:block}
.okt{position:absolute;inset:0;touch-action:none}
.fr{position:absolute;width:1672px;height:941px;pointer-events:none}
:where(.fr) button{font:inherit;color:inherit;border:0;padding:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;pointer-events:auto}
.glass{position:absolute;background:linear-gradient(180deg,rgba(26,22,20,.86),rgba(10,9,9,.86));border:1.5px solid rgba(255,220,170,.16);border-radius:16px;box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ib{position:absolute;width:70px;height:68px;border-radius:16px!important;display:grid;place-items:center;background:linear-gradient(180deg,rgba(30,26,24,.92),rgba(10,9,9,.92))!important;border:1.5px solid rgba(255,220,170,.18)!important;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.ib svg{width:34px;height:34px}
.ln{fill:none;stroke:#eee;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.fl{fill:#eee}
.title{height:68px;padding:0 22px 0 18px;display:flex;align-items:center;gap:14px;white-space:nowrap;min-width:250px}
.title i{width:12px;height:12px;border-radius:50%;background:#2fd36b;box-shadow:0 0 10px #2fd36b}
.title b{display:block;font-size:22px;font-weight:650}.title small{display:block;font-size:18px;opacity:.82;margin-top:2px}
.pc{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none}
.pc i{display:block;border-radius:50%;background:#333 center/cover;box-shadow:0 0 0 3px #c9934a,0 8px 20px rgba(0,0,0,.6);position:relative}
.pc b{display:block;font-size:22px;font-weight:650}.pc small{display:block;font-size:20px;opacity:.9;font-weight:600}
.pc.op{display:flex;flex-direction:column;align-items:center}
.pc.op i{width:92px;height:92px;z-index:1}
.pc.op span{margin-top:-10px;min-width:108px;padding:14px 12px 8px;text-align:center;border-radius:14px;background:linear-gradient(180deg,rgba(26,22,20,.9),rgba(10,9,9,.9));border:1.5px solid rgba(255,220,170,.16)}
.pc i::after{content:"";position:absolute;right:2px;bottom:4px;width:18px;height:18px;border-radius:50%;background:#2fd36b;border:3px solid #111;opacity:0}
.pc.net i::after{opacity:1}.pc.bot i::after{opacity:1;background:#888}
.pc.me{display:flex;align-items:center}
.pc.me i{width:104px;height:104px;z-index:1}
.pc.me span{margin-left:-14px;padding:12px 26px 12px 30px;min-width:150px;border-radius:0 18px 18px 0;background:linear-gradient(180deg,rgba(26,22,20,.92),rgba(10,9,9,.92));border:1.5px solid rgba(255,220,170,.16)}
.pc.me b{font-size:28px}.pc.me small{font-size:26px}
.pc.turn i{box-shadow:0 0 0 4px #ffcf6e,0 0 30px rgba(255,190,90,.9)}
.pc .bub{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) translateY(6px);background:#fff;color:#2a1810;font-size:19px;font-weight:650;padding:9px 15px;border-radius:14px;opacity:0;transition:.25s;white-space:nowrap}
.pc .bub.on{opacity:1;transform:translateX(-50%)}
.act{position:absolute;width:206px;height:68px;border-radius:16px!important;display:flex!important;align-items:center;gap:8px;padding:0 12px!important;box-sizing:border-box;background:linear-gradient(180deg,rgba(30,26,24,.92),rgba(10,9,9,.92))!important;border:1.5px solid rgba(255,220,170,.16)!important;box-shadow:0 8px 20px rgba(0,0,0,.5);font-size:18px!important;font-weight:600!important;color:#f2f2f2!important;transition:opacity .2s}
.act svg{width:34px;height:34px;flex:none}.act span{flex:1;text-align:center;white-space:nowrap}
.act:active{transform:translateY(1px)}
.act.dim{opacity:.55}
.act.fin{opacity:.55}
.act.fin.on{opacity:1;background:linear-gradient(180deg,#ffd77d,#d38f2c)!important;color:#3a1d03!important;box-shadow:0 4px 0 #7c501c,0 0 30px rgba(255,200,90,.7);animation:pulse 1.2s ease-in-out infinite alternate}
.act.fin.on .ln{stroke:#3a1d03}
.act.chat{width:166px;height:64px}
@keyframes pulse{to{box-shadow:0 4px 0 #7c501c,0 0 52px rgba(255,210,110,1)}}
.toast{position:absolute;transform:translate(-50%,-50%);padding:9px 24px;border-radius:24px;background:rgba(10,8,7,.82);border:1px solid rgba(255,215,150,.28);font-size:21px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.toast.warn{border-color:rgba(255,110,90,.7);color:#ffd6cf}
.teab{position:absolute;width:140px;padding:6px 0!important;border-radius:14px!important;font-size:16px!important;font-weight:700!important;background:rgba(20,14,10,.85)!important;border:1px solid rgba(255,220,160,.3)!important;color:#ffe2b3!important;display:none}
.teab.on{display:block}
.segs{display:flex;flex-wrap:wrap;gap:8px}
.segs button{padding:10px 16px;border-radius:12px;background:rgba(255,255,255,.07)!important;border:1.5px solid rgba(255,255,255,.12)!important;font-size:18px!important}
.segs button.on{background:#d9a24f!important;color:#2a1704!important;border-color:#d9a24f!important;font-weight:700!important}
.btn.sm{width:auto;margin:0;padding:8px 18px;font-size:18px!important}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;pointer-events:auto;z-index:5}
.modal[hidden]{display:none}
.card{position:relative;min-width:540px;max-width:900px;max-height:840px;overflow:auto;padding:30px 34px;box-sizing:border-box;border-radius:26px;background:linear-gradient(180deg,#2a1b17,#120c0a);border:1.5px solid rgba(255,215,140,.24);box-shadow:0 20px 60px rgba(0,0,0,.7);color:#fff}
.card h2{margin:0 0 18px;font-size:32px;font-weight:750;color:#f6d08a;text-align:center}
.card .x{position:absolute;right:16px;top:14px;width:48px;height:48px;border-radius:14px;font-size:30px;line-height:48px;color:rgba(255,255,255,.6)}
.btn{display:block;width:100%;margin:12px 0 0;padding:18px;border-radius:16px;font-size:24px!important;font-weight:750!important;background:linear-gradient(180deg,#f2c46c,#c98a35)!important;color:#2a1704!important;box-shadow:0 4px 0 #7c501c,0 8px 18px rgba(0,0,0,.4)}
.btn.ghost{background:rgba(255,255,255,.07)!important;color:#fff!important;box-shadow:none;border:1.5px solid rgba(255,255,255,.15)!important}
.row2{display:flex;gap:14px}.row2 .btn{flex:1}
.ovs{text-align:center;font-size:21px;opacity:.8;margin:6px 0 12px;line-height:1.45}
.big{text-align:center;font:800 64px ui-monospace,Menlo,monospace;letter-spacing:10px;color:#f6d08a;margin:6px 0 4px}
.inp{width:100%;box-sizing:border-box;padding:14px 16px;border-radius:14px;border:1.5px solid rgba(255,255,255,.15);background:rgba(0,0,0,.35);color:#fff;font-family:inherit;font-size:24px;font-weight:600;-webkit-user-select:text;user-select:text}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 6px}
.seats div{padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.06);font-size:20px}
.seats div small{display:block;opacity:.6;font-size:15px}
.phr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.phr button{padding:16px 18px;border-radius:16px;background:rgba(255,255,255,.07)!important;font-size:22px!important;text-align:left}
.rules{font-size:20px;line-height:1.5;opacity:.88;max-width:760px}
.tog{display:flex;justify-content:space-between;align-items:center;font-size:23px;padding:12px 4px}
.sw{width:76px;height:42px;border-radius:21px;background:rgba(255,255,255,.15)!important;position:relative}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:34px;height:34px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:#d9a24f!important}.sw.on::after{left:38px}
.lbl2{font-size:18px;opacity:.6;margin:14px 0 8px}
.okload{position:fixed;inset:0;display:grid;place-items:center;background:#120a07;color:#f3d08b;font:600 15px -apple-system,system-ui,sans-serif;z-index:9;transition:opacity .35s;text-align:center}
html.ready .okload{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="okload"><div>🫖<br>Çay demleniyor…</div></div>
<script src="i18n.js"></script>
<script src="net.js"></script>
<script src="okey.js" defer></script>
</body>
</html>
